# Every Saturday morning, put the newest Substack post (headline + subtitle)
# in the Ideas section of pleko.es. It can also be run by hand from the
# Actions tab ("Run workflow").
name: Latest Substack post

on:
  schedule:
    - cron: "0 7 * * 6"   # Saturdays 07:00 UTC (08:00/09:00 in Barcelona)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the latest-post card
        run: python3 .github/scripts/update_latest_post.py
      - name: Commit if it changed
        run: |
          if git diff --quiet; then
            echo "No new post."
            exit 0
          fi
          git config user.name "pleko-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Show the latest Substack post on the homepage"
          git push
